[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/project",
    "crates/media-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
license = "Apache-2.0"
authors = ["NodaVideo Contributors"]

[workspace.dependencies]
nodavideo-project = { path = "crates/project" }
nodavideo-media-engine = { path = "crates/media-engine" }
gpui-kit = "0.9.0"
anyhow = "1.0.95"
thiserror = "2.0.11"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tempfile = "3.17"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow common UI/app patterns
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
unreadable_literal = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
missing_const_for_fn = "allow"
future_not_send = "allow"
derive_partial_eq_without_eq = "allow"
redundant_closure_for_method_calls = "allow"
unused_self = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
manual_let_else = "allow"
collapsible_if = "allow"
chunks_exact_to_as_chunks = "allow"
assert_is_empty = "allow"

[profile.dev]
opt-level = 0
debug = true

# Optimize heavy UI framework dependencies in dev mode for responsive UI performance
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
